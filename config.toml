# 调参与端点 —— 进 git，随便谁读
# 密钥不在这里，见 secrets.toml（0600，不进 git）
# ⚠️ 所有键必填：代码里没有默认值，缺一个进程起不来（配置错误要在第一秒暴露）

# 跑批那一轮本身 —— 不属于任何单个阶段
[daily]
# 整轮墙钟预算（秒）。到点后不再启动新的下载 / 新的群，在飞的跑完就收工，
# 进程非零码退出（本轮没跑完必须看得见，不能绿灯过去）。
# ⚠️ **失控护栏，不是产能规划。** 它防的是「OSS 半死不活、每个文件都读到一半断」
#    —— 那时每个文件要耗满 3 × 120s，1000 群能跑 12 小时。
#    **抬它不解决产能问题，只是别让护栏先开火**：产能由 room_concurrency 和端点
#    吞吐决定，抬这个数只是把「护栏误伤正常跑批」的概率降下去。
#    真实可用窗口是「今晚到明早」，10 小时贴着它给，比此前的 6 小时保守值宽。
# 没跑完的群下一轮重来：lookback_days ≥ 2 时漏掉的那天还在窗口里，
# 且队首每天挪一大步（见 daily::run 的 STRIDE），不会总是同一批群被砍。
round_deadline_secs = 36000 # 10 小时

# ① 摄取 —— 本地 raw 区是 OSS 的字节级镜像
[ingest]
# <raw_root>/<yyyyMM>/<corpId>/<roomId>.ndjson
# 每天新增约 600 MB（1000 群 × 500 条 × 1.2 KB），一年约 216 GB
raw_root = "./data/raw"

# 本地保留几个月，更老的月目录整个删掉（每轮拉取后执行）。
# 保留起点锚在**窗口**上（窗口最早月往前推 N-1 个月），所以 lookback_days
# 配多大都不会把本轮要读的月份删掉。
# ⚠️ **它只约束跑批的输入，不再是 webUI 下钻的可见范围** —— 原文渲染快照在抽取时
#    就落进了 b_merchant_group_event.source_messages，工作台一个文件都不读。
#    这里留 2 个月是为了「抽取失败重跑」和 backfill 补跑还能读到原文；
#    降到 1 只留窗口月，那两件事就做不了了。
# ⚠️ 删除粒度是**整个月目录**（一个群一个月一个文件，删不了半个），
#    所以 M 月的原文会在 M+2 月 4 号那轮跑批消失 —— 月末的消息只活 33 天，月初的活 63 天。
# N=2 ⇒ 磁盘上界约 2 个月（1000 群约 36 GB）。此前没有任何清理，一年 216 GB 且永不回落。
raw_retention_months = 2

# 直连私有 OSS；服务端点不含 bucket，客户端会加上 bucket 子域名。
# 内网端点示例：https://oss-cn-hangzhou-internal.aliyuncs.com。
# AccessKey 放在 secrets.toml 的 [oss] 节。
oss = { endpoint = "https://oss-cn-zhangjiakou.aliyuncs.com", bucket = "jdd-rh-wechat", region = "cn-zhangjiakou" }

# 同时在飞的月文件下载数。无默认值，缺失即报错。
# ⚠️ 每个下载增量最多 64 MiB；正文峰值按并发乘上限计，8 路最多 512 MiB。
# 瞬时失败（连接类 / 超时 / 5xx / 429 / 408）在 mirror/download.rs 里重试 3 次、退避 1s→2s，
# 这些是常量不是配置项 —— 没有第二个用例。
mirror_concurrency = 8

# 同时读取、抽取和保存的群数。段之间串行，打标另用 classify.concurrency。
# ⚠️ **抽取和打标打的是两个不同的端点**（[llm.extract] / [llm.classify]），
#    两队各自的并发互不相干，不必核对对方。各自的上界由各自端点的配额定 ——
#    而那个配额今天**没有量过**：上量时按这个数跑一轮，grep 日志里 429 的 warn。
# ⚠️ 它同时约束 MySQL 连接峰值：见 [mysql].max_connections 那条（要 ≥ 本值 + classify.concurrency）。
room_concurrency = 10

# 回看窗口 N：跳过当天和昨天，读 [T-(N+1), T-2]。
# N=2 时，9 月 7 日跑批读取 9 月 4 日、5 日。
# ⚠️ N=2 时「周五提问、周一回复」永远拼不起来，损失系统性落在周五值班的人头上。
# 拿到真实数据后按周几分别量，跨 2 天以上才闭合的占比 > 5% 立刻调 4。
lookback_days = 2

# ③ 抽取 —— 段长
[extract]
# 一个群一天切成 ceil(n / segment_msgs) 段，段之间串行传便签（群内零接缝）。
# ⚠️ **省钱旋钮，不是质量旋钮**：切几段都不产生接缝，它只是省掉「拿整群去试、
#    注定被截断」那一次调用。设成「一次调用舒服跑完」的量级。
# 撑爆了不靠这个数救 —— extract 会按运行时信号（截断 / 超时）自适应二分，
# 没有阈值参数可调。无默认值，缺失即报错。
# 实测：3742 条 → ceil(3742/400) = 10 段，单段输出 5.5~6.3k token，
# 对着 llm.extract.max_tokens = 64000 有 10× 余量。
# ⚠️ 调大换墙钟是空的：墙钟由输出吞吐定（实测 105~116 tok/s），全群输出总量不随分段变。
segment_msgs = 400

# ⑤ 分类 —— 独立批次并发与结果缓存
[classify]
concurrency = 6                # 全局打标批次并发，独立于抽取群并发（两队端点不同）
# <cache_dir>/<taxonomy_version>-<策略指纹>.sqlite：sha256(summary) -> 标签全集；旧 NDJSON 首次导入并保留。
# ⚠️ **承重件，不是优化。** 模型打标不保证同输入同输出（temperature=0 也不保证），
#    而非冻结区每天重写 [T-3, T-2]、同一批 event 会被反复打标 —— 没有这个缓存，
#    报表就会「抖动而非修正」，正是承重不变量 1 要防的那件事。删它 = 报表不可用于同比环比。
# 指纹包含词表、提示词与模型请求配置；不同策略不会混用答案。
# 页缓存目标 2 MiB，历史答案按键读盘；不要删除数据库后重新问模型。
# 同一缓存文件只允许一个进程写入，daily / recompute / review 不要重叠使用同一策略。
# 历史 *-nearest.json 不再读取，也不会自动删除；其中可能含姓名片段，仍按 0600 保管。
cache_dir = "./data/taxonomy_cache"

# ③ 抽取和 ⑤ 打标是**两个不同的模型**，见下面两个子节。
# 这里的键是**两队共用**的：连接、响应、总预算都属于调用处置，推理与温度同样共用。
# ⚠️ **共用键必须写在 [llm.extract] / [llm.classify] 节头之前** ——
#    TOML 的节头一开，后面的键就全归那个子节，写在后面会静默变成子节的字段。
[llm]

# 推理默认关。两队都不需要它，实测答一个"2"开着要 45 token、关了 1 token。
# 可选值：none / minimal / low / medium / high / xhigh
reasoning_effort = "none"

# 抽取要可复现，不是创作。
# ⚠️ **打标那条线还额外靠它**：结果缓存是承重件（承重不变量 1），
#    temperature 一非零，「同 summary 同答案」就从高概率退成偶然。
temperature = 0.0

# 单次调用实测 118~168s，留 2 倍余量
timeout_secs = 300

# 包含 Retry-After、SDK 重试与分类重发的总预算；到期按调用失败处理，不触发切段。
request_timeout_secs = 1200

# 只管 TCP+TLS 握手：让「端点连不上」几秒内失败，不耗满上面按分钟计的超时
connect_timeout_secs = 10

# ③ 抽取那一队
[llm.extract]
model = "qwen3.8-flash"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# ⚠️ **承重数字，不是「模型收得下的最大值」。** 此前是 64000（qwen3.8-flash 的上限），
# 理由写的是「Truncated / Timeout 正是 extract 对半切的信号，压小会改掉切分行为」——
# 那句只看对了一半：上限给到 64000，**跑飞就撞不到 Truncated**。按实测输出吞吐
# 105~116 tok/s，生成满 64000 要约 570s，而 timeout_secs = 300 先到 —— 于是抽取侧的
# 跑飞一律伪装成 Timeout，白烧五分钟才切一刀，切出的两半各自又 1/3 概率再来一次。
# 跟 [llm.classify] 同一个道理：贴着实际需求给，跑飞秒撞 Truncated 让重发消化掉。
# 实测单段（segment_msgs = 400）输出 5.5~6.3k token，12000 是约 2 倍余量；
# 真超了仍是 Truncated，model.rs 重发两次确认后照样交给自适应二分去切。
# ⚠️ **这个数跟着 segment_msgs 走** —— 段长翻倍，这里也要重新量。
max_tokens = 12000

# ⑤ 打标那一队 —— recompute 重打标、taxonomy review 试打也走这一节
[llm.classify]
model = "qwen3.8-flash"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# ⚠️ **承重数字，不是旋钮。**（从 classify.rs 的 CLASSIFY_MAX_TOKENS 搬来 ——
# 那里此前是无条件钳位，会让这个文件里的数变成谎言，改成由 config.rs 的断言拒绝。）
# 一批 classify::BATCH = 50 条 × 每条一个小对象，正常输出不过 2000 token，6000 是 3 倍余量。
# **绝不能抄上面那个 64000**：上限一大，模型跑飞（strict JSON schema 下随机陷入重复
# 生成，实测中招率约三分之一）就没有任何东西拦得住，只能安静生成到撞满 timeout_secs，
# 再报一个无从下手的 Timeout —— 试打 870 条是 18 批，按这个中招率几乎每趟都要挂死几回，
# 正是「归纳跑一半卡住五分钟然后整趟报废」的主因。贴着实际需求给，跑飞秒撞 Truncated，
# extract_retry 重发即可。config.rs 的 load_from_dir 有一条 assert 拦「≥ 抽取那份」。
max_tokens = 6000

[log]
# error / warn / info / debug / trace
# ⚠️ async-openai 只埋了 warn 级别的点（429 限流 header、retry-after、5xx），
#    info 就已经全看得到；调 debug 只会让 reqwest/hyper 变啰嗦，看不到请求体。
# 环境变量 RUST_LOG 若存在会覆盖这里 —— 临时排障不用改文件。
level = "info"

[mysql]
# 连接 URL 带密码，不在这里 —— 见 secrets.toml 的 [mysql]
# 池上限。连接只在落库那几毫秒里握着（抽取全程不占连接）。
# ⚠️ **它同时是 `recompute` 并发度的上界**（那边会 assert 拦住）。
#    重打标要压进 1 小时需要并发 16（4.5M 输出 token ÷ 单流 ~110 tok/s ≈ 11.4 流·小时），
#    跑之前把这个数一起抬到 16 —— 池是懒建连接的，daily 用不到那么多，抬上界不花代价。
# ⚠️ **必须 ≥ room_concurrency + 2 × classify.concurrency**：抽取持一份连接，
#    打标持**两份** —— slots 那道许可只包住 update_event_labels，而
#    buffer_unordered(classify.concurrency) 同时让另一批群在 read_events /
#    finish_classification 上各持一条。三者互不相让。
#    小于这个和就会有群在写库时排队等连接，acquire_timeout 一到，报出来的是
#    「落库失败」—— 那个群整轮作废、刚烧完的 token 白花。
#    ⚠️ 这条规则改过两次，两次都是**低估**：最早写「≥ room_concurrency」（打标队列
#       独立出来之前的形状），后来写「≥ 和」（漏了打标的第二份）。低估的断言比没有
#       断言更糟 —— 它给运维一个会放行错误配置的数字。
#       真实峰值 10 + 2×6 − 1 = 21（同一个群不会同时在 slots 里和 slots 外），
#       断言取整数 22 不要那个 −1；24 留 2~3 的余量，够了，不必抬。
max_connections = 24
# 池子满了、等一条空闲连接的上限。超时报错，不无限挂着
acquire_timeout_secs = 30
# 空闲连接活多久就主动扔掉。**必须小于服务端 wait_timeout**，以及中间代理 / LB
# 的空闲超时 —— 取两者更小的那个再打对折。
# ⚠️ 大于它的话就是服务端先关，池里留一条死连接：下次 acquire 探活读到
#    `expected to read 4 bytes, got 0 bytes at EOF`，再花一次完整握手重建。
#    实测重建一次 18.5 秒，而 acquire_timeout_secs 是 30 —— 再慢一点就超时，
#    报出来是「落库失败」，那个群整轮作废、刚烧完的 token 白花。
# 240 是保守起点，不是实测值：只知道服务端侧 < 600 秒（sqlx 的默认 600 没救住，
# 仍读到 EOF）。部署时 `SHOW GLOBAL VARIABLES LIKE 'wait_timeout'` 查准了再调。
idle_timeout_secs = 240

# 只读后端独立预算。结果超限明确报错，不以残缺明细生成完整报表。
# 以下为保守起点，部署时结合两个进程的 RSS 和最大查询范围验收。
[web]
# 同时在飞的**请求**数，不是用户数。**不排队，拿不到名额直接 503。**
# 打开一次页面并发发 7 个请求（meta · dataset · summary · rooms · agents · categories · events），
# 所以名额要 ≥ 同时在线人数 × 7：12 只够一个人，第二个人刷新就有面板报错。
# 现在 48 = 6 个人同时刷新。缓存命中也占名额（只有一条戳查询，几毫秒就还），
# 所以它仍然是 MySQL 连接峰值的上界 —— 抬它要一起看 [mysql].max_connections（只读账号单独一个池）。
# ⚠️ **拆出更多接口时必须一起抬**。
concurrency = 48
max_response_bytes = 16777216 # 16 MiB；同时限制数据库文档累计字节与最终 JSON

# 白天的响应缓存总字节数（0 = 关）。数据只在夜里跑批时写，白天同一组筛选反复算是白烧。
# 失效不靠时间：每个请求先读一次库里的「数据戳」（四张表各自的最后一次写，全走索引），
# 戳变了整个缓存作废；戳距现在不足 60 秒视作跑批还在写，只查不存。见 src/web/cache.rs。
# ⚠️ 事件表与群日表要有 idx_modified (gmt_modified_time) 索引，否则戳查询本身就是全表扫描 ——
#    升级 SQL 见 docs/deploy.md「只读工作台响应缓存」。
cache_bytes = 268435456 # 256 MiB

# 一次响应最多几行（events 与 groupDaily **共用**这一份预算）。
# ⚠️ **它才是概览的真天花板**，字节预算在它之后才撞得到（实测事件 JSON 714 B，
#    16 MiB ÷ 714 B ≈ 23500 条 > 20000 行）。所以「把字段砍瘦」单独做救不了 ——
#    行数一条都没少。要抬它必须同时看内存：实测 JSON 在内存里放大约 6.8 倍
#    （47 MB → 318 MB），16 MiB 的响应峰值约 110 MB，再乘 concurrency。
max_rows = 20000

# 服务端语句执行上限。**这是护栏不是产能规划** —— 交互式筛选等 10 秒早就没人看了，
# 而它还占着一个 concurrency 名额。此前是 30 秒，那基本等于没有超时。
# 真正的体检在 budget.rs 的 SLOW_REQUEST（800ms 打 warn），两者分工不同。
query_timeout_secs = 10

# 外部名册（只读工作台专用；跑批不读这一节）—— 商家名称与客服姓名的来源。
# 这两份信息不在本项目库里，属于其他业务域，服务地址由 Nacos 管理、不是固定域名。
# ⚠️ **名字是展示，不是事实，也不是维度**：不进指标、不进聚合键、不落库，
#    取不到就回落显示 ID。理由内联在 src/web/roster.rs 的模块注释里。
# ⚠️ 全部必填，代码里没有默认值 —— 跟本文件其余部分同一个规矩。
[roster]
# Nacos 服务端地址。只要 scheme://host:port，**不带 /nacos 路径**（代码自己拼 v1 端点）。
# 账号密码在 secrets.toml 的 [roster] 节。
nacos = "http://127.0.0.1:8848"

# 命名空间 ID 与分组名。**即使用的就是 Nacos 的默认值也要显式写出来** ——
# 写进代码当默认值的话，配错了不会在启动时喊，只会表现成「解析不到实例」。
# 默认命名空间的 ID 是空串，默认分组名是 DEFAULT_GROUP。
namespace = "public"
group_name = "DEFAULT_GROUP"

# 商家域与员工域的服务名。写错即**启动失败**，错误信息带上服务名。
merchant_service = "merchant-service"
employee_service = "employee-service"

# 名册（ID → 名字）的整体存活时间。到期整张表清空重查，不做逐条过期 ——
# 名册规模很小（客服二十余人、商家数百），逐条过期要多存 N 个时间戳换不来东西。
# 300 秒 = 商家改名后最坏 5 分钟在页面上看到。
ttl_secs = 300

# Nacos 与两个业务服务共用的 HTTP 超时。这是**内网调用**，秒级即可 ——
# 给大了只会让上游卡住时把 web.query_timeout_secs 的预算一起耗掉。
timeout_secs = 3
