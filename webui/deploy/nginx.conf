# 只读看板的静态托管。前端是纯静态产物，/api/* 反代到同机的只读 JSON 服务。
#
# 四条是必须的：
#   1. try_files 回落到 index.html —— 前端走 BrowserRouter，深链接（/rooms、
#      /detail?drawer=123）直接刷新时必须由前端接管路由，否则 404。
#   2. index.html 不许缓存 —— 带 hash 的静态资源可以长缓存，入口文件不行，
#      否则发版后用户拿着旧 index 去请求已经不存在的 chunk。
#   3. gzip_proxied any —— 只有 gzip on 不会压缩反代响应，/api/* 会原样出网。
#   4. proxy_pass 末尾**不带斜杠** —— 后端路由本身就是 /api/meta、/api/summary
#      （见 src/web/serve.rs 的 route 列表）。写成 `http://127.0.0.1:8787/`
#      会把 /api 前缀剥掉，后端一律 404，而页面报的是「接口返回 404」，
#      看上去像后端没起来。
#
# 部署步骤见 docs/deploy-webui.md。
server {
    listen 30001;
    server_name 39.98.175.5;
    root /srv/chat2events-webui;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # ⚠️ 没有这一行，/api/* 就是**未压缩出网** —— nginx 默认不压缩反代响应
    # （gzip_proxied 默认 off），而群日记录那种「几千行同一组键」的 JSON
    # 正是压缩比最高的形状。改了没生效完全静默：响应照常返回，只是大八倍。
    # 验证命令见 docs/deploy.md 的「上线前的检查」。
    gzip_proxied any;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端自己的语句超时是 web.query_timeout_secs（当前 10 秒），
        # 这里留够余量，让超时由后端报成 JSON 错误，而不是 nginx 报 504。
        proxy_read_timeout 30s;
        # 看板只读：非 GET 一律拒绝，从入口上堵死写操作
        limit_except GET HEAD { deny all; }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
