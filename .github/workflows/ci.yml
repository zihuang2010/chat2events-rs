# CI —— 检查 + 出 Linux 二进制。
#
# ⚠️ 这里跑的是**离线**那部分。`store` 的写库 SQL 要真 MySQL、`LiveModel` 要真端点，
#    两者都没有离线测试 —— CI 全绿 ≠ 全验过，见 docs/deploy.md 结尾。
#
# ⚠️ 慢的原因是 DuckDB：Cargo.toml 开了 features = ["bundled"]，
#    首次构建要现场编 C++ amalgamation（分钟级）。rust-cache 就是为它上的。

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # 没有 rustfmt.toml 是有意的 —— cargo fmt 的默认配置就是本仓库的风格
      - run: cargo fmt --check

      # --all-targets：examples/ 和测试代码一起查，不然 examples 里的告警溜过去
      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

  # 只在打 tag 时构建产物 —— 平时的 PR 不该为 release profile 再编一遍 DuckDB
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      # 动态链 glibc：runner 的 glibc 版本 = 部署机的下界，见 docs/deploy.md
      - name: 记录 glibc 下界
        run: ldd --version | head -1 | tee glibc-baseline.txt

      - name: 打包
        run: |
          tar -czf chat2events-rs-linux-x86_64.tar.gz \
            -C target/release chat2events-rs

      # gh 是 runner 自带的，不引第三方 action
      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            chat2events-rs-linux-x86_64.tar.gz glibc-baseline.txt \
            --generate-notes
