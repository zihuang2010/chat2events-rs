# 独立 crate，**不在** chat2events-rs 的构建里 —— 父 Cargo.toml 没有 [workspace]，
# 所以 `cargo build` / `cargo test` / CI 完全看不到这里。跑它要 cd 进来。
#
# 依赖全是纯 Rust（candle 的 CPU 后端是 `gemm`，tokenizers 关掉 onig/esaxx 的 C++），
# 目标机 CentOS 7 / glibc 2.17 编得动 —— **不碰 ONNX Runtime**（它 1.16 起要 glibc ≥ 2.28）。
[package]
name = "intent-head-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] } # fancy-regex 是纯 Rust 的那条路（onig 是 C）
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.dev]
opt-level = 2  # 不开的话 4 层 BERT 前向在 debug 下慢两个数量级
