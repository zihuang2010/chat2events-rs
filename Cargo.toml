[package]
name = "chat2events-rs"
version = "0.1.5"
edition = "2024"

[dependencies]
async-openai = { version = "0.41.3", features = ["chat-completion"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# `json` 必须显式开：`ingest` 用 read_json_auto，而它在 json 扩展里。不开的话
# DuckDB 会在运行时按 AUTOINSTALL 默认值联网去 extensions.duckdb.org 下载 ——
# 跑批机在内网，出不去就是第一次 read_room() 整轮死。开了它静态链进二进制。
duckdb = { version = "1.10505.0", features = ["bundled", "json", "chrono"] }
regex = "1.12"
# `rustls` 必须由**我们自己**声明：`mirror` 走 https 拉月文件，而 TLS 此前是
# async-openai 顺手替我们打开的 —— 换掉模型层就会静默变成「每个群都拉不下来」。
# 不开 `http2`：这个负载是 8 路并发的长请求，1.1 连接池就够，见 src/llm.rs 顶注。
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql", "chrono"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
