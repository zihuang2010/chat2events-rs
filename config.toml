# 调参与端点 —— 进 git，随便谁读
# 密钥不在这里，见 secrets.toml（0600，不进 git）
# ⚠️ 所有键必填：代码里没有默认值，缺一个进程起不来（配置错误要在第一秒暴露）

# 跑批那一轮本身 —— 不属于任何单个阶段
[daily]
# 整轮墙钟预算（秒）。到点后不再启动新的下载 / 新的群，在飞的跑完就收工，
# 进程非零码退出（本轮没跑完必须看得见，不能绿灯过去）。
# ⚠️ 失控护栏，不是调优旋钮：正常一轮分钟级。它防的是「OSS 半死不活、每个文件
#    都读到一半断」—— 那时每个文件要耗满 3 × 120s，1000 群能跑 12 小时。
# 没跑完的群下一轮重来：lookback_days ≥ 2 时漏掉的那天还在窗口里。
round_deadline_secs = 21600 # 6 小时

# ① 摄取 —— 本地 raw 区是 OSS 的字节级镜像
[ingest]
# <raw_root>/<yyyyMM>/<corpId>/<roomId>.ndjson
# 每天新增约 600 MB（1000 群 × 500 条 × 1.2 KB），一年约 216 GB
raw_root = "./data/raw"

# 本地保留几个月，更老的月目录整个删掉（每轮拉取后执行）。
# 保留起点锚在**窗口**上（窗口最早月往前推 N-1 个月），所以 lookback_days
# 配多大都不会把本轮要读的月份删掉。
# ⚠️ 它同时是 webUI 下钻的可见范围：超出保留期的事件取不到原文，会显式报错。
#    「本地没有就回 OSS 取」的兜底还没做。
# N=2 ⇒ 磁盘上界约 2 个月（1000 群约 36 GB）。此前没有任何清理，一年 216 GB 且永不回落。
raw_retention_months = 2

# 下载根地址（CDN）。拼上索引表的 ndjson_object_key 就是月文件的 URL。
# 不是密钥 —— 公开域名，所以在这里而不是 secrets.toml。
# ⚠️ 这条路径配了 30 天 CDN 缓存，Cache-Control 和随机 query 参数都绕不掉。
#    兜底是字节数校验：拿到旧副本 = 该群本轮失败，数据不会写坏。
download_base_url = "https://filet.jdd51.com"

# 同时在飞的月文件下载数。无默认值，缺失即报错。
# ⚠️ 它同时是内存旋钮：响应整包进内存，峰值 = 这个数 × 最大月文件
#    （月末冷启动 8 × 18 MB ≈ 144 MB）。往上调之前先乘一遍。
# 瞬时失败（连接类 / 超时 / 5xx / 429 / 408）在 mirror/download.rs 里重试 3 次、退避 1s→2s，
# 这些是常量不是配置项 —— 没有第二个用例。
mirror_concurrency = 8

# 同时在处理的群数。无默认值，缺失即报错。
# 段之间仍然串行，并行只加在群与群之间。
# 曾测拐点在 8：100 群 / 555 MB / 12 核，串行 9.81s → k=8 2.48s，k=12 起不再变快。
# ⚠️ **这个数在第六轮之后失效了**：它是「每个群新开一条 DuckDB 连接」时代量的，
#   而共享实例把单群读取成本压掉一个数量级（10 群 957ms → 71ms），拐点必然前移。
#   重量之前别拿它当依据 —— 何况 ③ 接上后约束本来就变成端点 TPM。
# ⚠️ ③ 抽取接上之后，约束就从「本机核数」变成「端点 TPM」，调之前先看限流。
room_concurrency = 8

# 回看窗口 N：读 [T-N, T-1]
# ⚠️ N=2 时「周五提问、周一回复」永远拼不起来，损失系统性落在周五值班的人头上。
# 拿到真实数据后按周几分别量，跨 2 天以上才闭合的占比 > 5% 立刻调 4。
lookback_days = 2

# ③ 抽取 —— 段长
[extract]
# 一个群一天切成 ceil(n / segment_msgs) 段，段之间串行传便签（群内零接缝）。
# ⚠️ **省钱旋钮，不是质量旋钮**：切几段都不产生接缝，它只是省掉「拿整群去试、
#    注定被截断」那一次调用。设成「一次调用舒服跑完」的量级。
# 撑爆了不靠这个数救 —— extract 会按运行时信号（截断 / 超时）自适应二分，
# 没有阈值参数可调。无默认值，缺失即报错。
# 实测：3742 条 → ceil(3742/400) = 10 段，单段输出 5.5~6.3k token，
# 对着 llm.max_tokens = 64000 有 10× 余量。
# ⚠️ 调大换墙钟是空的：墙钟由输出吞吐定（实测 105~116 tok/s），全群输出总量不随分段变。
segment_msgs = 400

# ⑤ 分类 —— 打标结果缓存
[classify]
# <cache_dir>/<taxonomy_version>.ndjson：sha256(summary) -> type_id，只增不减。
# ⚠️ **承重件，不是优化。** 模型打标不保证同输入同输出（temperature=0 也不保证），
#    而非冻结区每天重写 [T-2, T-1]、同一批 event 会被反复打标 —— 没有这个缓存，
#    报表就会「抖动而非修正」，正是承重不变量 1 要防的那件事。删它 = 报表不可用于同比环比。
# 一个词表版本一个文件：v0 的答案绝不能拿来当 v1 的答案。
# 体量：10 万条约 12 MB（每行 = 64 字符 hex + type_id）。不清理。
# ⚠️ **这个目录不是「只有 hash」。** 上面那句只说了 ndjson；同目录的
#    `*-nearest.json`（下面 margin 那节）里 `vocab` 是字符 bigram，数字抹成 `#` 但
#    **姓名和地址不掩**（承重不变量 7），拼接可读回片段。它按 0600 落盘，
#    ndjson 不需要。别把这两个文件当同一个密级搬运或归档。
cache_dir = "./data/taxonomy_cache"

# 本地类心（字符 bigram + IDF，见 src/nearest.rs）敢不敢用的门槛：
# 最近类心与次近之差达到它才用本地答案，否则回落去问模型 —— **绝不硬塞最近的类**。
# 模型文件是 <cache_dir>/<版本>-<指纹>-nearest.json，由 examples/recompute.rs 训练并写出；
# 文件不存在 = 还没训练过，两条路都退回全部问模型（v0 和首次重打标之前的正常状态）。
# ⚠️ **daily 和 recompute 必须同一个值**，否则冻结区和 [T-2, T-1] 用两套口径，
#    边界上同类事件标签不同 —— 承重不变量 1 要防的那种抖动。所以它在这里不在命令行。
# ⚠️ **这个 0.05 是占位，不是实测值。** 跑一次 recompute，看日志里
#    「留出集（margin / 覆盖率 / 一致率）」那张表再定：一致率是质量，覆盖率是省下的钱。
#    设成 1.0 等于关掉本地类心。
# ⚠️ **现在就是 1.0 = 关掉本地类心**，为的是 v1 首次重打标的探路趟拿到纯模型真值和
#    那张留出集表。看完表定出真值再改回来 —— 别把 1.0 带进全量趟。
margin = 1.0

[llm]
model = "qwen3.8-flash"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# 推理默认关。抽取任务不需要它，实测答一个"2"开着要 45 token、关了 1 token。
# 可选值：none / minimal / low / medium / high / xhigh
reasoning_effort = "none"

# 抽取要可复现，不是创作
temperature = 0.0

# ⚠️ 跟着模型变：qwen3.8-flash 收 64000，qwen-plus 只到 32768（超了直接报 range 错）
max_tokens = 64000

# 单次调用实测 118~168s，留 2 倍余量
timeout_secs = 300

# 只管 TCP+TLS 握手：让「端点连不上」几秒内失败，不耗满上面按分钟计的超时
connect_timeout_secs = 10

[log]
# error / warn / info / debug / trace
# ⚠️ async-openai 只埋了 warn 级别的点（429 限流 header、retry-after、5xx），
#    info 就已经全看得到；调 debug 只会让 reqwest/hyper 变啰嗦，看不到请求体。
# 环境变量 RUST_LOG 若存在会覆盖这里 —— 临时排障不用改文件。
level = "info"

[mysql]
# 连接 URL 带密码，不在这里 —— 见 secrets.toml 的 [mysql]
# 池上限。连接只在落库那几毫秒里握着（抽取全程不占连接）。
# ⚠️ **它同时是 `examples/recompute.rs` 并发度的上界**（那边会 assert 拦住）。
#    重打标要压进 1 小时需要并发 16（4.5M 输出 token ÷ 单流 ~110 tok/s ≈ 11.4 流·小时），
#    跑之前把这个数一起抬到 16 —— 池是懒建连接的，daily 用不到那么多，抬上界不花代价。
# ⚠️ **必须 ≥ room_concurrency**：小于它就会有群在写库时排队等连接，
#    acquire_timeout 一到，报出来的是「落库失败」—— 那个群整轮作废、
#    刚烧完的 token 白花。room_concurrency 仍是 8，这里的 16 是为 recompute 抬的，两条都满足。
max_connections = 16
# 池子满了、等一条空闲连接的上限。超时报错，不无限挂着
acquire_timeout_secs = 30
