; chat2events 部署配置：supervisor 管只读工作台，cron 管 T+2 跑批。
;
; 装法：cp 到 /etc/supervisord.d/chat2events-webui.ini（或 /etc/supervisor/conf.d/，看发行版）
;       改下面的 <corpid> 和 user，然后
;       supervisorctl reread && supervisorctl update && supervisorctl status chat2events-webui
;
; 目标机先建好日志目录：
;       mkdir -p /mnt/rustserver/prod/chat2events/logs
;       chown chat2events /mnt/rustserver/prod/chat2events/logs
;
; ⚠️ 监听地址保持 127.0.0.1 —— 接口没有任何鉴权，对外那道口令在 nginx 上（见 docs/deploy-webui.md）

[program:chat2events-webui]
; 参数：<配置目录> <corpid> [监听地址]。配置目录就是 bin 自己，config.toml / secrets.toml 都在这
command=/mnt/rustserver/prod/chat2events/bin/webui /mnt/rustserver/prod/chat2events/bin <corpid> 127.0.0.1:8787
directory=/mnt/rustserver/prod/chat2events/bin
user=chat2events

autostart=true
autorestart=true
; 起来 5 秒不退才算 RUNNING —— 配置错（Nacos 解析不到 / secrets.toml 不是 0600 / corpid 错）
; 都是启动期立刻退，这个值让 supervisor 三次后标 FATAL 停手，而不是无限拉起
startsecs=5
startretries=3

; ⚠️ 必须是 INT：进程按 SIGINT 优雅收尾，等在飞请求结束再退。默认的 TERM 它不接
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; 日志全走 stderr（src/config.rs:63），非 tty 时自动不带 ANSI 颜色
redirect_stderr=true
stdout_logfile=/mnt/rustserver/prod/chat2events/logs/webui.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7

environment=RUST_BACKTRACE="1",TZ="Asia/Shanghai"


; ============================================================================
; 跑批（daily）—— 故意不在 supervisor 里，用 cron。三条硬理由：
;   1. 它跑完即退出，supervisor 的模型是「常驻进程」，一次性任务只能靠
;      autostart=false + supervisorctl start 触发，而那条命令是**异步返回**的，
;      cron 立刻拿到 0，跑批成没成一无所知。
;   2. 非零退出码必须活着 —— 预算耗尽 / 有群 failed 就是非零码，告警接在这个码上
;      （docs/deploy.md「别把非零退出码吃掉」）。走 supervisorctl 这个码就没了。
;   3. config.toml 里 raw_root / cache_dir 是相对路径，必须先 cd 到固定工作目录，
;      否则镜像和分类缓存会落进 cron 的 $HOME。
;
; crontab -u chat2events -e，贴下面这段：
;
;   SHELL=/bin/bash
;   TZ=Asia/Shanghai
;   MAILTO=运维邮箱          # 非零退出码和 stderr 都会寄过来，这就是告警
;
;   # T+2 跑批：每天 03:15 一轮，读 [T-3, T-2]
;   15 3 * * * cd /mnt/rustserver/prod/chat2events/bin && ./chat2events-rs . >> /mnt/rustserver/prod/chat2events/logs/daily-$(date +\%Y\%m).log 2>&1
;
; ⚠️ cron 里的 % 必须转义成 \% —— 不转的话 cron 把它当换行，命令会从那里被截断。
; ⚠️ 日志按月分文件，自己长不封顶。要轮转就加 /etc/logrotate.d/chat2events：
;      /mnt/rustserver/prod/chat2events/logs/daily-*.log { monthly rotate 6 compress missingok notifempty }
;
; 手动跑一轮（同样要 cd）：
;   sudo -u chat2events bash -c 'cd /mnt/rustserver/prod/chat2events/bin && ./chat2events-rs .'
;
; ⚠️ 跑批、recompute 重打标、taxonomy 试打共用同一份分类缓存，同一时刻只许一个进程写，
;    冲突时后启动的那个直接报错退出（docs/deploy.md）。人工操作避开 03:15 那一轮。
