# CI —— 检查 + 出发布产物：跑批 · 只读后端 · 全部运维入口这些 Linux 二进制，
# 和前端静态站。两个 tar 包，分别扔到 /opt 和 nginx 的 root。
#
# ⚠️ 这里不写二进制的**个数**，`BINS` 也不手写 —— 那个数会跟着 `src/bin/` 变，
#    写死在注释里只会变成下一次的误导。清单由 build job 从源码布局算出来。
#
# 离线逻辑与模型 HTTP 协议走默认测试；事务与只读取数另在隔离 MySQL 中验证。
# 真实模型业务质量、OSS 权限与目标机部署仍需各自验收。
#
# ⚠️ 慢的原因是 DuckDB：Cargo.toml 开了 features = ["bundled", "json"]，
#    要现场编 352 个 C++ unity TU（分钟级）。check 侧靠 rust-cache，
#    release 侧靠 build job 里那份对象缓存，两边互不相干。
#
# tag 上的三个 job：build（编二进制）和 check / webui **并行**，
# publish 等齐三个才发 Release —— 质量门在 publish，不在 build。

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  webui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          # setup-node 自带的 pnpm 缓存要求 pnpm 已经在 PATH 上，而它下一步才装 ——
          # 所以关掉它，自己缓存 pnpm store（见下面那步）。
          package-manager-cache: false
      - run: npm install --global pnpm@11.21.0

      # 缓存的是 pnpm 的**内容寻址 store**，不是 node_modules —— 后者是一堆指回
      # store 的硬链接，跨 job 恢复会退化成真实拷贝，又大又慢。
      # 键只认 lockfile：`--frozen-lockfile` 装的东西完全由它决定，
      # 所以不要 restore-keys —— 命中就是全中，不中就老实下载。
      - id: store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.dir }}
          key: pnpm-${{ hashFiles('webui/pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      # 前端产物必须在这里出：目标机（CentOS 7）上没有 Node，dist 是纯静态文件，
      # 跟六个二进制一样属于"发出去的东西"。此前这一步编完就扔，Release 里只有二进制。
      # 只在 tag 上传 —— 每个 PR 都传等于白占 artifact 存储。
      - name: 交付前端静态产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          # ⚠️ path 不吃 defaults.run.working-directory（那只管 run 步），要写全。
          path: webui/dist
          retention-days: 1
          if-no-files-found: error

  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: chat2events_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # 没有 rustfmt.toml 是有意的 —— cargo fmt 的默认配置就是本仓库的风格
      - run: cargo fmt --check

      # --all-targets：bins / examples / 测试代码一起查，不然那些 target 里的告警溜过去
      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --locked

      - name: 验证真实 MySQL 事务与只读取数
        env:
          CHAT2EVENTS_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/chat2events_test
        run: cargo test --locked mysql_ -- --ignored

  # 只在打 tag 时构建产物 —— 平时的 PR 不该为 release profile 再编一遍 DuckDB。
  #
  # ⚠️ **故意不 needs check** —— 编 DuckDB 的十几分钟和 check 的十几分钟之间
  #    没有因果关系，串起来就是 tag 的墙钟翻倍。质量门落在 publish 上
  #    （它 needs check ＋ webui），所以 check 红了照样发不出去，
  #    代价只是 check 失败时白编一轮 runner 时间。
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # 编译容器。**它的 digest 进对象缓存的键**，所以 docker run 和取 digest
      # 那步必须认同一个串 —— 不许两处各写一遍。
      IMAGE: quay.io/pypa/manylinux2014_x86_64
    steps:
      - uses: actions/checkout@v5

      # 发出去的全部二进制。**符号自检 · json 自检 · 打包三处共用这一份**，
      # 而且**从源码布局算出来、不手写** —— 照 cargo 的默认目标发现规则：
      # `src/main.rs` → 包名，`src/bin/*.rs` → 文件名（Cargo.toml 里没有 `[[bin]]`
      # 段，所以这两条就是全部；加了显式 `[[bin]]` 就要回来改这里）。
      #
      # ⚠️ **手写过两轮，两轮都漏。** 第一轮三处各自写死 `chat2events-rs webui`，
      #    四个运维入口编得出来却既不进基线也不进 tar 包；收成一个 env 补齐到六个
      #    之后，v0.1.7 新增的 `src/bin/retry.rs` 又漏了一遍 —— 发出去的包里没有它。
      #    清单和 `src/bin/` 本来就是同一件事，让它自己数，这个错就再也犯不出来。
      - name: 枚举要发布的二进制
        run: |
          bins="chat2events-rs $(basename -s .rs -a src/bin/*.rs | tr '\n' ' ')"
          echo "发布二进制：$bins"
          echo "BINS=$bins" >> "$GITHUB_ENV"

      # crate 源码：省下 duckdb-sys 那个几十 MB 源码包的下载，键只认 Cargo.lock。
      - name: 缓存 crate 源码
        uses: actions/cache@v4
        with:
          path: .cargo-home/registry
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}

      # 先 pull 再取 digest：`docker run` 反正要拉这个镜像，这里只是把它提前，
      # 好让 digest 能进下面那个缓存键。
      - id: image
        name: 解析编译容器的 digest
        run: |
          docker pull -q "$IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          echo "使用 $IMAGE@$digest"
          echo "digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"

      # DuckDB 那 352 个 C++ TU 占了 release 构建绝大部分墙钟，而它的产物只随
      # **duckdb 版本 · 编译选项 · 编译器**变化 —— 本仓库的 Rust 代码改一行不影响它。
      # 所以只缓存这一个 crate 的对象文件（本地实测 out/ 约 170 MB），
      # **不缓存整个 target/**（GB 级，压缩传输的时间反过来吃掉省下的编译时间）。
      #
      # ⚠️ 键里这三样都必须在，少一个就是「拿另一套配置编出来的 .o 去链」：
      #   镜像 digest  —— manylinux2014 是**滚动 tag**，devtoolset 的 gcc 会悄悄升版
      #   本文件        —— RUSTFLAGS / CXXFLAGS 改了，对象就不能复用
      #   Cargo.lock   —— duckdb 版本
      #
      # ⚠️ **没有 restore-keys，只认精确命中** —— 前缀回退恢复的正是上面要挡的东西。
      #    不中就老实编十几分钟，那是正确行为，不是退化。
      #
      # 兜底：下面「校验 glibc / libstdc++ 下界」每轮都跑，陈旧对象带来的符号回归
      # 会在那里当场暴露，不会一路发到目标机。另外 cc-rs 会 emit
      # rerun-if-env-changed=CXXFLAGS，所以编译选项变了 cargo 自己也会重跑构建脚本。
      - name: 缓存 DuckDB 的 C++ 对象
        uses: actions/cache@v4
        with:
          path: |
            target/release/build/libduckdb-sys-*
            target/release/.fingerprint/libduckdb-sys-*
          key: duckdb-${{ steps.image.outputs.digest }}-${{ hashFiles('Cargo.lock', '.github/workflows/ci.yml') }}

      # ⚠️ 不在 runner 上直接 cargo build：runner 的 glibc(2.39) 会成为部署机的下界，
      #    而目标机是 CentOS 7（glibc 2.17 / libstdc++ 来自 GCC 4.8，最高 GLIBCXX_3.4.19）。
      #
      # ⚠️ 也不用 jobs.<id>.container 把整个 job 塞进这个镜像：GitHub Actions 的 node20
      #    runtime 要 glibc ≥ 2.28，CentOS 7 里 checkout / rust-toolchain 全部起不来。
      #    所以 job 照常跑在 ubuntu-latest，只把**编译这一步**丢进容器。
      #
      # manylinux2014 = CentOS 7 底 + devtoolset-10（gcc 10，DuckDB 是 C++，4.8 编不动）。
      # -static-libstdc++/-static-libgcc：新 gcc 的 GLIBCXX 符号静态链进来，
      # 否则二进制会要 GLIBCXX_3.4.20+，而目标机只有 3.4.19。
      #
      # ⚠️ 这个容器里编 DuckDB 必须给 DUCKDB_CUSTOM_PLATFORM，原因不是"没传对宏"：
      #    devtoolset-10 为了兼容 CentOS 7 自带的 libstdc++（GCC 4.8，只有旧 ABI）
      #    是按 gcc4-compatible ABI 构建的，它的 `bits/c++config.h` 会 **#undef 掉**
      #    命令行给的 `-D_GLIBCXX_USE_CXX11_ABI=1` 再改回 0 —— 实测：那个 -D 确实出现在
      #    cc-rs 的编译命令行上（cc 1.4.4 把 CXXFLAGS 追加在所有 -D 之后），
      #    `common/platform.hpp` 照样 `#error`。所以这个宏在这里压根压不住，别再试。
      #
      #    DUCKDB_CUSTOM_PLATFORM 是 DuckDB 自己在 `#error` 提示语里给的逃生舱：
      #    定义之后 `DuckDBPlatform()` 直接返回这个串，整段判据被预处理器跳过。
      #    平台串只用来**下载**扩展，而 json 是静态链进来的（下面有自检挡着）、
      #    跑批机也在内网出不去 —— 这个串对本仓库是纯装饰，取 gcc4 是照实写。
      #    libstdc++ 静态链进二进制，全仓一套 ABI 自洽，旧 ABI 无外部影响。
      - name: 在 glibc 2.17 环境里构建
        run: |
          docker run --rm -v "$PWD":/w -w /w \
            -e CARGO_HOME=/w/.cargo-home \
            -e RUSTUP_HOME=/w/.rustup-home \
            -e CARGO_TERM_COLOR=always \
            -e RUSTFLAGS='-C link-arg=-static-libstdc++ -C link-arg=-static-libgcc' \
            -e CXXFLAGS='-DDUCKDB_CUSTOM_PLATFORM=linux_amd64_gcc4' \
            "$IMAGE" \
            bash -euxo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable --profile minimal
              . "$CARGO_HOME/env"
              rustc -V
              # 打 c++ 而不是 gcc —— cc-rs 调用的是 c++ 这个名字，上一轮查错就卡在这
              c++ --version | head -1
              cargo build --release --locked
            '
          sudo chown -R "$(id -u):$(id -g)" target .cargo-home .rustup-home

      # 自检：产物实际要求的符号版本必须落在目标机（CentOS 7 / gcc 4.8.5）能给的范围内。
      # 这条挡的是静默回归 —— 换镜像/换 RUSTFLAGS 之后二进制悄悄要上新符号，
      # 不检查的话要等部署到机器上才发现。
      #
      # ⚠️ 判据是**上界**，不是「有没有 GLIBCXX_」。`-static-libstdc++` 之后
      #    objdump -T 里的 GLIBCXX_ 条目不会消失：devtoolset-10 只把 base
      #    libstdc++.so.6 给不出的新符号静态链进来，旧符号照旧走动态库。
      #    要命的是「要了目标机给不出的版本」，所以比版本，不比有无。
      - name: 校验 glibc / libstdc++ 下界
        run: |
          # ⚠️ **全查，一个不漏** —— 运维入口也发到目标机上跑，漏掉它们等于基线
          #    只覆盖了一半产物。清单来自「枚举要发布的二进制」那步，
          #    符号自检 / json 自检 / 打包三处共用同一份，**不许各写各的**。
          #
          # 顺带当了存在性检查：清单是从 src/bin/ 算的、构建是 cargo 做的，
          # 两边要是对不上（比如有人加了显式 [[bin]] 改名），ldd 在这里就报文件不存在，
          # 而不是等到 tar 那步悄悄打出一个少了东西的包。
          PATHS=$(for b in $BINS; do echo -n "target/release/$b "; done)
          ldd $PATHS
          objdump -T $PATHS | grep -o 'GLIB[A-Z_]*_[0-9.]*[0-9]' | sort -Vu | tee glibc-baseline.txt
          # ceiling <符号前缀> <目标机能给的最高版本>
          ceiling() {
            max=$(grep "^$1" glibc-baseline.txt | sort -V | tail -1) || true
            echo "最高 $1 符号：${max:-（无）}"
            [ -z "$max" ] || [ "$(printf '%s\n%s\n' "$max" "$2" | sort -V | tail -1)" = "$2" ] \
              || { echo "::error::二进制要求 $max，超出目标机的 $2"; exit 1; }
          }
          ceiling GLIBC_ GLIBC_2.17
          ceiling GLIBCXX_ GLIBCXX_3.4.19

      # 同一性质的自检：json 扩展必须静态链在二进制里。
      # 掉了的话 DuckDB 会在运行时联网去 extensions.duckdb.org 下载 —— 跑批机在内网，
      # 出不去就是第一次 read_room() 整轮死，而 CI 全绿。挡的是 features 被人顺手改回去。
      # json_serialize_sql 只出现在扩展源码里，本仓库的 SQL 不含它。
      - name: 校验 json 扩展已静态链
        run: |
          for BIN in $BINS; do
            BIN="target/release/$BIN"
            grep -qa 'json_serialize_sql' "$BIN" \
              || { echo "::error::$BIN 的 json 扩展没链进去"; exit 1; }
          done

      - name: 打包二进制
        run: |
          tar -czf chat2events-rs-linux-x86_64.tar.gz -C target/release $BINS

      # 传的是打好的 tar，不是六个裸二进制 —— 每个都几十 MB（DuckDB 静态链进去了），
      # 让 artifact 再压一遍纯属浪费。publish 拿到就能直接发。
      - name: 交付二进制与符号基线
        uses: actions/upload-artifact@v4
        with:
          name: release-bins
          path: |
            chat2events-rs-linux-x86_64.tar.gz
            glibc-baseline.txt
          retention-days: 1
          if-no-files-found: error

  # 质量门：check / webui 红了就发不出去，哪怕 build 已经编完。
  # 这个 job 只搬文件、不编译，所以也**不 checkout** —— `gh` 用 -R 直接打 API。
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, webui, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取回二进制与符号基线
        uses: actions/download-artifact@v4
        with:
          name: release-bins

      # 前端不在 manylinux 容器里编（纯静态 JS，跟 glibc 无关），从 webui job 取回。
      - name: 取回前端静态产物
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui-dist

      - name: 打包前端
        run: |
          # 解开即 nginx 的 root：index.html 和 assets/ 在压缩包根上，
          # 不套一层 dist/ —— 部署是 `tar -xzf ... -C /srv/chat2events-webui`。
          tar -czf chat2events-webui-dist.tar.gz -C webui-dist .

      # gh 是 runner 自带的，不引第三方 action
      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            -R "${GITHUB_REPOSITORY}" \
            chat2events-rs-linux-x86_64.tar.gz \
            chat2events-webui-dist.tar.gz \
            glibc-baseline.txt \
            --generate-notes
