# 只读看板的静态托管 —— 39.98.175.5:30001。前端是纯静态产物，/api/* 反代到同机后端。
# 部署步骤见 docs/deploy-webui.md。
#
# ⚠️ 上线前必须改两处：root 的实际路径、$auth_by_pass 里的口令。
#    口令没改的话谁都进不来（默认值是无效占位）—— 这是有意的，失败要朝安全的方向倒。

# ── 访问口令 ────────────────────────────────────────────────────────────────
# map 必须在 http 上下文：conf.d/*.conf 整个被 http 块 include，所以写在
# server 外面就对了，放进 server 里 nginx -t 直接报错。
#
# 原理：口令对上 → auth_basic 变成 "off"，认证整个跳过；对不上 → 去查
# /dev/null（空文件，必然失败）→ 401 带 WWW-Authenticate，浏览器正常弹框。
# 这样就不用维护 htpasswd 文件。
#
# ⚠️ **base64 不是加密，等于明文** —— 两层意思：
#    ① 口令明文过网（HTTP），这道闸挡的是「扫到端口的人随手打开」，不是抓包的对手；
#    ② 口令明文躺在这个文件里，**而这个文件在 git 仓库里**。改成真口令之后
#       这份就不能再提交回去 —— 只改目标机上的 /etc/nginx/conf.d/ 那份。
#
# 生成：printf 'board:你的密码' | base64
#      ⚠️ 必须 printf，用 echo 会多一个换行，算出来的值对不上，现象是口令永远错。
map $http_authorization $auth_by_pass {
    "Basic UExBQ0VIT0xERVI6Q0hBTkdFLU1F"  "off";   # ← 占位符，替换成真口令的 base64
    default                        "Chat2Events Board";
}

# 本机免密：运维 curl 验证和探活不用带口令。加人就在上面那个 map 里加一行。
map $remote_addr $board_realm {
    "127.0.0.1"  "off";
    default      $auth_by_pass;
}

server {
    listen 30001;
    server_name 39.98.175.5;

    # ⚠️ 必须是**解开后直接有 index.html 的那一层**，不套 dist/。
    #    nginx worker 还要能穿过这条路径上的每一级目录（每级都要有 x 权限）——
    #    报 403 且 error.log 是 stat() 目录 failed，就是这个。
    root /mnt/rustserver/prod/chat2events/webui;

    # 写在 server 级，静态页和 /api/ 一起受保护。只给 location / 加是常见漏配：
    # 接口仍然裸奔，curl 一条就能把全库事件摘要拉走。
    auth_basic           $board_realm;
    auth_basic_user_file /dev/null;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # ⚠️ 没有这一行，/api/* 就是**未压缩出网** —— nginx 默认不压缩反代响应
    # （gzip_proxied 默认 off），而群日记录那种「几千行同一组键」的 JSON
    # 正是压缩比最高的形状。改了没生效完全静默：响应照常返回，只是大八倍。
    gzip_proxied any;

    # 带 hash 的资源可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ⚠️ 入口文件不许缓存，否则发版后用户拿着旧 index 去请求已经不存在的 chunk
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        # ⚠️ 末尾**不带斜杠** —— 后端路由本身就是 /api/dataset、/api/summary
        #    （见 src/web/serve.rs）。写成 http://127.0.0.1:8787/ 会剥掉 /api
        #    前缀，后端一律 404，而页面报「接口返回 404」，看着像后端没起来。
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端自己的语句超时是 web.query_timeout_secs（当前 10 秒），这里留够余量，
        # 让超时由后端报成 JSON 错误，而不是 nginx 报 504。
        proxy_read_timeout 30s;
        # 看板只读：非 GET 一律拒绝，从入口上堵死写操作
        limit_except GET HEAD { deny all; }
    }

    # ⚠️ 前端走 BrowserRouter，深链接（/rooms、/detail?drawer=123）直接刷新时
    #    必须由前端接管路由，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
