# 只读看板的静态托管示例。前端是纯静态产物，/api/* 反代到只读 JSON 服务。
#
# 两条是必须的：
#   1. try_files 回落到 index.html —— 前端走 BrowserRouter，深链接（/rooms、
#      /detail?drawer=123）直接刷新时必须由前端接管路由，否则 404。
#   2. index.html 不许缓存 —— 带 hash 的静态资源可以长缓存，入口文件不行，
#      否则发版后用户拿着旧 index 去请求已经不存在的 chunk。
server {
    listen 80;
    server_name chat2events-board.internal;
    root /srv/chat2events-webui;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        # 看板只读：非 GET 一律拒绝，从入口上堵死写操作
        limit_except GET HEAD { deny all; }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
