# CI —— 检查 + 出 Linux 二进制。
#
# 离线逻辑与模型 HTTP 协议走默认测试；事务与只读取数另在隔离 MySQL 中验证。
# 真实模型业务质量、OSS 权限与目标机部署仍需各自验收。
#
# ⚠️ 慢的原因是 DuckDB：Cargo.toml 开了 features = ["bundled", "json"]，
#    要现场编 352 个 C++ unity TU（分钟级）。rust-cache 就是为它上的。

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  webui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: chat2events_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # 没有 rustfmt.toml 是有意的 —— cargo fmt 的默认配置就是本仓库的风格
      - run: cargo fmt --check

      # --all-targets：bins / examples / 测试代码一起查，不然那些 target 里的告警溜过去
      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --locked

      - name: 验证真实 MySQL 事务与只读取数
        env:
          CHAT2EVENTS_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/chat2events_test
        run: cargo test --locked mysql_ -- --ignored

  # 只在打 tag 时构建产物 —— 平时的 PR 不该为 release profile 再编一遍 DuckDB
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, webui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 发出去的全部二进制。**符号自检 · json 自检 · 打包三处共用这一份** ——
      # 曾经三处各自逐字写死 `chat2events-rs webui`，于是 `src/bin/` 里新增的
      # 运维入口编得出来、却既不进基线也不进 tar 包，等于没发。
      BINS: chat2events-rs webui backfill recompute recover taxonomy
    steps:
      - uses: actions/checkout@v5

      # ⚠️ 不在 runner 上直接 cargo build：runner 的 glibc(2.39) 会成为部署机的下界，
      #    而目标机是 CentOS 7（glibc 2.17 / libstdc++ 来自 GCC 4.8，最高 GLIBCXX_3.4.19）。
      #
      # ⚠️ 也不用 jobs.<id>.container 把整个 job 塞进这个镜像：GitHub Actions 的 node20
      #    runtime 要 glibc ≥ 2.28，CentOS 7 里 checkout / rust-toolchain 全部起不来。
      #    所以 job 照常跑在 ubuntu-latest，只把**编译这一步**丢进容器。
      #
      # manylinux2014 = CentOS 7 底 + devtoolset-10（gcc 10，DuckDB 是 C++，4.8 编不动）。
      # -static-libstdc++/-static-libgcc：新 gcc 的 GLIBCXX 符号静态链进来，
      # 否则二进制会要 GLIBCXX_3.4.20+，而目标机只有 3.4.19。
      #
      # ⚠️ 这个容器里编 DuckDB 必须给 DUCKDB_CUSTOM_PLATFORM，原因不是"没传对宏"：
      #    devtoolset-10 为了兼容 CentOS 7 自带的 libstdc++（GCC 4.8，只有旧 ABI）
      #    是按 gcc4-compatible ABI 构建的，它的 `bits/c++config.h` 会 **#undef 掉**
      #    命令行给的 `-D_GLIBCXX_USE_CXX11_ABI=1` 再改回 0 —— 实测：那个 -D 确实出现在
      #    cc-rs 的编译命令行上（cc 1.4.4 把 CXXFLAGS 追加在所有 -D 之后），
      #    `common/platform.hpp` 照样 `#error`。所以这个宏在这里压根压不住，别再试。
      #
      #    DUCKDB_CUSTOM_PLATFORM 是 DuckDB 自己在 `#error` 提示语里给的逃生舱：
      #    定义之后 `DuckDBPlatform()` 直接返回这个串，整段判据被预处理器跳过。
      #    平台串只用来**下载**扩展，而 json 是静态链进来的（下面有自检挡着）、
      #    跑批机也在内网出不去 —— 这个串对本仓库是纯装饰，取 gcc4 是照实写。
      #    libstdc++ 静态链进二进制，全仓一套 ABI 自洽，旧 ABI 无外部影响。
      - name: 在 glibc 2.17 环境里构建
        run: |
          docker run --rm -v "$PWD":/w -w /w \
            -e CARGO_HOME=/w/.cargo-home \
            -e RUSTUP_HOME=/w/.rustup-home \
            -e CARGO_TERM_COLOR=always \
            -e RUSTFLAGS='-C link-arg=-static-libstdc++ -C link-arg=-static-libgcc' \
            -e CXXFLAGS='-DDUCKDB_CUSTOM_PLATFORM=linux_amd64_gcc4' \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -euxo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable --profile minimal
              . "$CARGO_HOME/env"
              rustc -V
              # 打 c++ 而不是 gcc —— cc-rs 调用的是 c++ 这个名字，上一轮查错就卡在这
              c++ --version | head -1
              cargo build --release --locked
            '
          sudo chown -R "$(id -u):$(id -g)" target .cargo-home .rustup-home

      # 自检：产物实际要求的符号版本必须落在目标机（CentOS 7 / gcc 4.8.5）能给的范围内。
      # 这条挡的是静默回归 —— 换镜像/换 RUSTFLAGS 之后二进制悄悄要上新符号，
      # 不检查的话要等部署到机器上才发现。
      #
      # ⚠️ 判据是**上界**，不是「有没有 GLIBCXX_」。`-static-libstdc++` 之后
      #    objdump -T 里的 GLIBCXX_ 条目不会消失：devtoolset-10 只把 base
      #    libstdc++.so.6 给不出的新符号静态链进来，旧符号照旧走动态库。
      #    要命的是「要了目标机给不出的版本」，所以比版本，不比有无。
      - name: 校验 glibc / libstdc++ 下界
        run: |
          # ⚠️ 六个二进制全查 —— 运维入口（backfill/recompute/recover/taxonomy）也发到
          #    目标机上跑，漏掉它们等于基线只覆盖了一半产物。清单在 job 的 env.BINS 里，
          #    符号自检 / json 自检 / 打包三处共用同一份，**不许各写各的**。
          PATHS=$(for b in $BINS; do echo -n "target/release/$b "; done)
          ldd $PATHS
          objdump -T $PATHS | grep -o 'GLIB[A-Z_]*_[0-9.]*[0-9]' | sort -Vu | tee glibc-baseline.txt
          # ceiling <符号前缀> <目标机能给的最高版本>
          ceiling() {
            max=$(grep "^$1" glibc-baseline.txt | sort -V | tail -1) || true
            echo "最高 $1 符号：${max:-（无）}"
            [ -z "$max" ] || [ "$(printf '%s\n%s\n' "$max" "$2" | sort -V | tail -1)" = "$2" ] \
              || { echo "::error::二进制要求 $max，超出目标机的 $2"; exit 1; }
          }
          ceiling GLIBC_ GLIBC_2.17
          ceiling GLIBCXX_ GLIBCXX_3.4.19

      # 同一性质的自检：json 扩展必须静态链在二进制里。
      # 掉了的话 DuckDB 会在运行时联网去 extensions.duckdb.org 下载 —— 跑批机在内网，
      # 出不去就是第一次 read_room() 整轮死，而 CI 全绿。挡的是 features 被人顺手改回去。
      # json_serialize_sql 只出现在扩展源码里，本仓库的 SQL 不含它。
      - name: 校验 json 扩展已静态链
        run: |
          for BIN in $BINS; do
            BIN="target/release/$BIN"
            grep -qa 'json_serialize_sql' "$BIN" \
              || { echo "::error::$BIN 的 json 扩展没链进去"; exit 1; }
          done

      - name: 打包
        run: |
          tar -czf chat2events-rs-linux-x86_64.tar.gz -C target/release $BINS

      # gh 是 runner 自带的，不引第三方 action
      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            chat2events-rs-linux-x86_64.tar.gz glibc-baseline.txt \
            --generate-notes
